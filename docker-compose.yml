version: "3.8"

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - rag-net

networks:
  rag-net:
    driver: bridge

volumes:
  postgres-data:
  chroma-data:
  minio-data:
  redis-data:

services:
  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *app-defaults
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_pass
      POSTGRES_DB: rag_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    <<: *app-defaults
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible storage for dev) ─────────────────
  minio:
    image: minio/minio:latest
    <<: *app-defaults
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB ──────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:latest
    <<: *app-defaults
    environment:
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "false"
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma

  # ── Backend API ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *app-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_NAME: "CollegeRAG"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      DATABASE_URL: "postgresql+asyncpg://rag_user:rag_pass@postgres:5432/rag_platform"
      REDIS_URL: "redis://redis:6379/0"
      STORAGE_BACKEND: "s3"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET_NAME: "rag-uploads"
      S3_REGION: "us-east-1"
      CHROMA_PERSIST_DIR: "/data/chroma"
      CHROMA_COLLECTION_NAME: "rag_documents"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-mistral}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
      LOG_LEVEL: "INFO"
      TESSERACT_CMD: "/usr/bin/tesseract"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost"]'
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/data/chroma

  # ── Celery Worker ─────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *app-defaults
    entrypoint: ["celery", "-A", "app.tasks.worker", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://rag_user:rag_pass@postgres:5432/rag_platform"
      REDIS_URL: "redis://redis:6379/0"
      STORAGE_BACKEND: "s3"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadmin"
      S3_BUCKET_NAME: "rag-uploads"
      S3_REGION: "us-east-1"
      CHROMA_PERSIST_DIR: "/data/chroma"
      CHROMA_COLLECTION_NAME: "rag_documents"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-mistral}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
      LOG_LEVEL: "INFO"
      TESSERACT_CMD: "/usr/bin/tesseract"
    volumes:
      - chroma-data:/data/chroma

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    <<: *app-defaults
    depends_on:
      - backend
    ports:
      - "80:80"
